name: Cosmic Retro V0.1

on:
  push:
    branches:
      - cosmicretro-v0.1
    paths:
      - cosmicretro/**
      - .github/workflows/cosmicretro-v0.1.yml
  pull_request:
    paths:
      - cosmicretro/**
      - .github/workflows/cosmicretro-v0.1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmicretro-v0.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore cosmicretro/CosmicRetro.slnx --locked-mode

      - name: Executar testes
        run: dotnet test cosmicretro/CosmicRetro.slnx --configuration Release --no-restore

      - name: Publicar Windows x64
        run: dotnet publish cosmicretro/src/CosmicRetro.App/CosmicRetro.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output "${{ runner.temp }}/cosmicretro-win-x64"

      - name: Incluir avisos de terceiros
        run: python cosmicretro/tools/export-third-party-notices.py --output "${{ runner.temp }}/cosmicretro-win-x64/ThirdPartyNotices"

      - name: Compactar aplicativo
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/cosmicretro-win-x64/*" -DestinationPath "${{ runner.temp }}/CosmicRetro-win-x64.zip"

      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: CosmicRetro-win-x64
          path: ${{ runner.temp }}/CosmicRetro-win-x64.zip
          if-no-files-found: error
          retention-days: 14
